# ============================================================
# Selenium Impact Analyzer — GitHub Actions Workflow
# With PR merge blocking
# ============================================================

name: Selenium Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.java'

jobs:
  impact-analysis:
    name: Detect Impacted Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # ── 1. Checkout with full git history ──
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Run Impact Analysis ──
      - name: Run Impact Analysis
        run: |
          TOOL_PATH="tools/selenium-impact-analyzer"

          python3 $TOOL_PATH/analyzer.py \
            --repo . \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --html impact_report.html \
            --json impact_report.json \
            --ci 2>&1 | tee ci_raw.txt || true

          # Strip ANSI color codes for clean PR comment
          sed 's/\x1b\[[0-9;]*m//g' ci_raw.txt > ci_summary.md

          # ── Read impacted test count from JSON ──
          IMPACTED=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('impact_report.json'))
              print(d['summary']['impacted_test_count'])
          except:
              print(0)
          ")

          echo "IMPACTED_COUNT=$IMPACTED" >> $GITHUB_ENV
          echo "Impacted test count: $IMPACTED"

      # ── 4. Post comment on PR ──
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const count = parseInt(process.env.IMPACTED_COUNT || '0');

            let summary = '';
            try {
              summary = fs.readFileSync('ci_summary.md', 'utf8').trim();
            } catch(e) {
              summary = '⚠️ Impact analysis output not found.';
            }

            // Status banner at the top of the comment
            const banner = count > 0
              ? `> 🚨 **${count} test(s) impacted — merge is blocked until reviewed.**`
              : `> ✅ **No tests impacted — safe to merge.**`;

            // Delete previous bot comment to avoid duplicates
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.includes('Selenium Impact Analysis')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${banner}\n\n${summary}\n\n---\n_Triggered by commit \`${{ github.event.pull_request.head.sha }}\`_`
            });

      # ── 5. Upload HTML + JSON report ──
      - name: Upload Impact Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact-report-PR-${{ github.event.pull_request.number }}
          path: |
            impact_report.html
            impact_report.json
          retention-days: 30

      # ── 6. BLOCK MERGE if tests are impacted ──
      # This step fails the entire job → GitHub blocks the merge button.
      # The PR author must review impacted tests before merging.
      - name: Block merge if tests impacted
        run: |
          COUNT=${{ env.IMPACTED_COUNT }}
          if [ "$COUNT" -gt "0" ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ❌  MERGE BLOCKED"
            echo "  $COUNT test case(s) are impacted by this PR."
            echo "  Review the impacted tests in the PR comment above."
            echo "  Once confirmed safe, an admin can override and merge."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo "✅ No tests impacted. Safe to merge."
          fi