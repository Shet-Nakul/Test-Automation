# ============================================================
# Selenium Impact Analyzer — GitHub Actions Workflow
# ============================================================

name: Selenium Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.java'

jobs:
  impact-analysis:
    name: Detect Impacted Tests
    runs-on: ubuntu-latest

    # ── FIX 1: Explicit permissions for PR comment posting ──
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # ── 1. Checkout with full git history ──
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Setup Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Run Impact Analysis ──
      - name: Run Impact Analysis
        id: impact
        run: |
          TOOL_PATH="tools/selenium-impact-analyzer"

          # Run analyzer - captures plain text output (no colors for CI)
          python3 $TOOL_PATH/analyzer.py \
            --repo . \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --html impact_report.html \
            --json impact_report.json \
            --ci 2>&1 | tee ci_raw.txt || true

          # ── FIX 2: Strip ANSI color codes so PR comment is clean markdown ──
          sed 's/\x1b\[[0-9;]*m//g' ci_raw.txt > ci_summary.md

          echo "--- Clean summary ---"
          cat ci_summary.md

      # ── 4. Post clean comment on PR ──
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let summary = '';
            try {
              summary = fs.readFileSync('ci_summary.md', 'utf8').trim();
            } catch(e) {
              summary = '⚠️ Impact analysis output not found.';
            }

            // Delete any previous bot comment on this PR (keeps it clean)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.includes('Selenium Impact Analysis')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Post fresh comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${summary}\n\n---\n_Triggered by commit \`${{ github.event.pull_request.head.sha }}\`_`
            });

      # ── 5. Upload HTML + JSON report as artifact ──
      - name: Upload Impact Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact-report-PR-${{ github.event.pull_request.number }}
          path: |
            impact_report.html
            impact_report.json
          retention-days: 30